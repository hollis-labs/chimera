name: checks
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test -race ./...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sha256sum --check third_party/checksums.sha256
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run build:example --prefix frontend
      - run: mkdir -p .scratch && GOWORK=off go build -o .scratch/fake-controlplane ./examples/fake-controlplane
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: npm run test:browser --prefix frontend
      - run: npm run test:upstream-frames --prefix frontend
